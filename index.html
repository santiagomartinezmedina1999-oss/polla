<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Polla Mundial PRO</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
    }

    input {
      padding: 8px;
      margin-top: 5px;
      width: 80px;
    }

    button {
      padding: 6px 12px;
      margin-top: 5px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background: gray;
    }
  </style>
</head>

<body>

<h1>🏆 Polla Mundial 2026</h1>

<button onclick="login()">Ingresar con Google</button>
<p id="user"></p>

<hr>

<h2>📅 Partidos</h2>
<div id="matches"></div>

<h2>🏆 Ranking</h2>
<div id="ranking"></div>

<script type="module">

// 🔥 Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ⚠️ PON TU CONFIG AQUÍ
const firebaseConfig = {
  apiKey: "AIzaSyADea3fGR1RYBKY79FDCu3mv7q64lTF5YX4",
  authDomain: "polla-562b1.firebaseapp.com",
  projectId: "polla-562b1",
  storageBucket: "polla-562b1.appspot.com",
  messagingSenderId: "511684328736",
  appId: "1:511684328736:web:893aecdc3c8d7247d1aab45"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = "";

// 🔐 LOGIN
window.login = async () => {
  const result = await signInWithPopup(auth, provider);
  currentUser = result.user.displayName;
  document.getElementById("user").innerText = "👤 " + currentUser;
};

// 📅 PARTIDOS (simulados Mundial)
const matches = [
  { id: 1, teams: "Colombia vs Brasil", date: "2026-06-15T18:00" },
  { id: 2, teams: "Argentina vs Francia", date: "2026-06-16T20:00" },
  { id: 3, teams: "España vs Alemania", date: "2026-06-17T18:00" }
];

// ⚽ RESULTADOS REALES (simulación)
const results = {
  1: "1-2",
  2: "2-2",
  3: "1-0"
};

// ⛔ BLOQUEO
function isLocked(date) {
  return new Date() >= new Date(date);
}

// 🧮 PUNTOS
function calculate(pred, real) {
  let [ph, pa] = pred.split("-").map(Number);
  let [rh, ra] = real.split("-").map(Number);

  if (ph === rh && pa === ra) return 3;

  if (
    (ph > pa && rh > ra) ||
    (ph < pa && rh < ra) ||
    (ph === pa && rh === ra)
  ) return 1;

  return 0;
}

// ✅ RENDER PARTIDOS
function renderMatches() {
  const div = document.getElementById("matches");
  div.innerHTML = "";

  matches.forEach(m => {
    const locked = isLocked(m.date);

    div.innerHTML += `
      <div class="card">
        <p>${m.teams}</p>
        <p>${new Date(m.date).toLocaleString()}</p>

        <input id="input-${m.id}" placeholder="2-1" ${locked ? "disabled" : ""}>
        <button ${locked ? "disabled" : ""} onclick="save(${m.id})">
          Guardar
        </button>
      </div>
    `;
  });
}

// ✅ GUARDAR EN FIREBASE
window.save = async (matchId) => {
  const val = document.getElementById(`input-${matchId}`).value;

  if (!currentUser) return alert("Primero inicia sesión");

  await addDoc(collection(db, "predictions"), {
    user: currentUser,
    matchId,
    prediction: val
  });
};

// 📊 RANKING EN VIVO
onSnapshot(collection(db, "predictions"), (snap) => {
  let data = snap.docs.map(d => d.data());

  let scores = {};

  data.forEach(p => {
    let real = results[p.matchId];
    let pts = real ? calculate(p.prediction, real) : 0;

    if (!scores[p.user]) scores[p.user] = 0;
    scores[p.user] += pts;
  });

  let ranking = Object.entries(scores)
    .map(([name, pts]) => ({ name, pts }))
    .sort((a, b) => b.pts - a.pts);

  const div = document.getElementById("ranking");
  div.innerHTML = "";

  ranking.forEach((r, i) => {
    let medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "";

    div.innerHTML += `
      <div class="card">
        ${medal} ${r.name} - ${r.pts} pts
      </div>
    `;
  });
});

renderMatches();

</script>

</body>
</html>
